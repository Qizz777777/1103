    /* 讓網頁全螢幕顯示，消除預設邊距與滾動條 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0f3f6;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }

    let score = 0;               // 總得分
    let submitted = false;       // 是否已經點擊交卷
    let confettiActive = false;  // 是否啟動彩帶特效
    let confettiParticles = [];  // 彩帶粒子陣列

    // 介面按鈕 UI
    let prevButton;              // 上一題按鈕
    let nextButton;              // 下一題按鈕
    let submitButton;            // 交卷看成績按鈕

    function setup() {
      // 建立全螢幕且具響應式的 p5.js 畫布
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.style('display', 'block');
      
      // 初始化 20 題完整題庫，並隨機抽取 10 題
      initQuestionBank();
      
      // 建立控制按鈕
      createUIElements();
    }

    function draw() {
      // 設定畫布背景顏色（柔和的淺藍灰色調）
      background(240, 243, 246);

      // 繪製頂部標題與測驗指引
      drawHeader();

      // 如果尚未交卷，顯示測驗選擇題畫面；如果已交卷，顯示總成績與彩帶動畫
      if (!submitted) {
        drawQuizInterface();
      } else {
        drawResultInterface();
        
        // 若總成績高於 60%，繪製過關彩帶特效
        if (confettiActive) {
          updateAndDrawConfetti();
        }
      }
    }

    // 將 20 題打亂並隨機挑選 10 題作為本次測驗
    function pickRandomTenQuestions() {
      let shuffled = shuffle([...allQuestions]);
      quizQuestions = shuffled.slice(0, 10);

      // 將每一題的 6 個選項順序隨機打亂，並重置使用者的選擇狀態
      for (let q of quizQuestions) {
        q.userSelectionIndex = null;
        shuffle(q.options, true);
      }
    }

    // 建立畫布下方的操作按鈕（上一題、下一題、交卷看成績）
    function createUIElements() {
      // 上一題按鈕
      prevButton = createButton('⬅ 上一題');
      prevButton.position(width / 2 - 160, height - 75);
      prevButton.style('padding', '12px 20px');
      prevButton.style('font-size', '15px');
      prevButton.style('background-color', '#6c757d');
      prevButton.style('color', 'white');
      prevButton.style('border', 'none');
      prevButton.style('border-radius', '8px');
      prevButton.style('cursor', 'pointer');
      prevButton.style('box-shadow', '0 4px 6px rgba(0,0,0,0.1)');
      
      prevButton.mousePressed(() => {
        if (!submitted && currentQuestionIndex > 0) {
          currentQuestionIndex--;
          updateButtonVisibility();
        }
      });

      // 下一題按鈕
      nextButton = createButton('下一題 ➡');
      nextButton.position(width / 2 + 30, height - 75);
      nextButton.style('padding', '12px 20px');
      nextButton.style('font-size', '15px');
      nextButton.style('background-color', '#0d6efd');
      nextButton.style('color', 'white');
      nextButton.style('border', 'none');
      nextButton.style('border-radius', '8px');
      nextButton.style('cursor', 'pointer');
      nextButton.style('box-shadow', '0 4px 6px rgba(0,0,0,0.1)');
      
      nextButton.mousePressed(() => {
        if (!submitted && currentQuestionIndex < quizQuestions.length - 1) {
          currentQuestionIndex++;
          updateButtonVisibility();
        }
      });

      // 交卷看成績按鈕（最後一題才會出現）
      submitButton = createButton('交卷看總成績 🎯');
      submitButton.position(width / 2 - 80, height - 75);
      submitButton.style('padding', '12px 24px');
      submitButton.style('font-size', '15px');
      submitButton.style('background-color', '#198754');
      submitButton.style('color', 'white');
      submitButton.style('border', 'none');
      submitButton.style('border-radius', '8px');
      submitButton.style('cursor', 'pointer');
      submitButton.style('box-shadow', '0 4px 6px rgba(0,0,0,0.1)');
      
      submitButton.mousePressed(() => {
        if (!submitted) {
          calculateScore();
          submitted = true;
          prevButton.hide();
          nextButton.hide();
          submitButton.hide();
        }
      });

      // 初始化按鈕顯示狀態
      updateButtonVisibility();
    }

    // 根據目前題目的索引，動態調整按鈕的顯示與隱藏
    function updateButtonVisibility() {
      if (currentQuestionIndex === 0) {
        prevButton.hide();
      } else {
        prevButton.show();
      }

      if (currentQuestionIndex === quizQuestions.length - 1) {
        nextButton.hide();
        submitButton.show();
      } else {
        nextButton.show();
        submitButton.hide();
      }
    }

    // 繪製頂部標題說明
    function drawHeader() {
      fill(33, 37, 41);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(24);
      text("p5.js 基礎程式設計 - 圖像化選項測驗系統", width / 2, 30);
      
      textSize(14);
      fill(108, 117, 125);
      let progressText = submitted ? "測驗已完成" : `目前進度：第 ${currentQuestionIndex + 1} 題 / 共 ${quizQuestions.length} 題`;
      text(progressText + " | 觀察題目與選項圖示，點擊正確的選項卡片作答", width / 2, 60);
    }

    // 繪製選擇題主介面（上方題目區與下方 6 個對應圖像選項）
    let optionBoxes = [];

    function drawQuizInterface() {
      let q = quizQuestions[currentQuestionIndex];
      
      // 上方題目與背景區塊
      fill(255);
      stroke(222, 226, 230);
      strokeWeight(2);
      rectMode(CENTER);
      
      let boxWidth = min(width * 0.85, 700);
      let boxHeight = 130;
      let boxX = width / 2;
      let boxY = 135;
      rect(boxX, boxY, boxWidth, boxHeight, 15);

      fill(33, 37, 41);
      noStroke();
      textSize(17);
      textAlign(CENTER, CENTER);
      text(q.title, boxX, boxY);

      // 下方六個圖像卡片選項
      let startX = width / 2 - 320;
      let startY = 260;
      let spacingX = 220;
      let spacingY = 115;

      optionBoxes = [];

      for (let i = 0; i < q.options.length; i++) {
        let opt = q.options[i];
        let col = i % 3;
        let row = floor(i / 3);
        
        let optX = startX + col * spacingX;
        let optY = startY + row * spacingY;
        let optW = 195;
        let optH = 95;

        rectMode(CENTER);
        
        // 判斷是否選中
        if (q.userSelectionIndex === i) {
          fill(209, 231, 255);
          stroke(13, 110, 253);
          strokeWeight(2.5);
        } else {
          fill(255);
          stroke(222, 226, 230);
          strokeWeight(2);
        }
        rect(optX, optY, optW, optH, 12);

        // 繪製選項專屬的大型視覺 Emoji 圖示
        textSize(24);
        textAlign(CENTER, CENTER);
        text(opt.emoji, optX, optY - 20);

        // 繪製選項文字名稱
        fill(33, 37, 41);
        noStroke();
        textSize(14);
        textAlign(CENTER, CENTER);
        text(opt.text, optX, optY + 16);

        optionBoxes.push({
          index: i,
          x: optX - optW / 2,
          y: optY - optH / 2,
          w: optW,
          h: optH
        });
      }
    }

    // 滑鼠點擊事件：判定使用者點擊了哪一個選項
    function mousePressed() {
      if (submitted) return;

      let q = quizQuestions[currentQuestionIndex];
      
      for (let box of optionBoxes) {
        if (
          mouseX > box.x &&
          mouseX < box.x + box.w &&
          mouseY > box.y &&
          mouseY < box.y + box.h
        ) {
          q.userSelectionIndex = box.index;
          break;
        }
      }
    }

    // 計算總成績
    function calculateScore() {
      score = 0;
      let total = quizQuestions.length;
      
      for (let q of quizQuestions) {
        if (q.userSelectionIndex !== null) {
          let selectedOpt = q.options[q.userSelectionIndex];
          if (selectedOpt && selectedOpt.correct) {
            score += 1;
          }
        }
      }

      let percentage = (score / total) * 100;
      if (percentage > 60) {
        confettiActive = true;
        initConfetti();
      }
    }

    // 繪製成績與總結介面
    function drawResultInterface() {
      fill(255);
      stroke(222, 226, 230);
      strokeWeight(2);
      rectMode(CENTER);
      
      let resW = min(width * 0.85, 520);
      let resH = 250;
      let resX = width / 2;
      let resY = height / 2 - 20;
      
      rect(resX, resY, resW, resH, 15);

      fill(33, 37, 41);
      noStroke();
      textSize(24);
      textAlign(CENTER, CENTER);
      text("🎉 測驗總成績結算", resX, resY - 75);

      let total = quizQuestions.length;
      let percentage = (score / total) * 100;
      textSize(20);
      text(`你的得分：${score} / ${total} 題 (${percentage}%)`, resX, resY - 20);

      textSize(16);
      if (percentage > 60) {
        fill(40, 167, 69);
        text("太棒了！成績超過 60%，成功解鎖彩色彩帶慶祝特效！🌟", resX, resY + 35);
      } else {
        fill(220, 53, 69);
        text("再加油一下！多複習 p5.js 基礎觀念就能過關喔！💪", resX, resY + 35);
      }
    }

    // 初始化彩帶粒子系統
    function initConfetti() {
      confettiParticles = [];
      for (let i = 0; i < 180; i++) {
        confettiParticles.push({
          x: random(width),
          y: random(-height, 0),
          size: random(8, 16),
          color: color(random(200, 255), random(100, 200), random(100, 255)),
          speedY: random(2, 6),
          speedX: random(-2, 2),
          rotation: random(TWO_PI),
          rotationSpeed: random(0.02, 0.08)
        });
      }
    }

    // 更新並繪製過關彩帶動畫
    function updateAndDrawConfetti() {
      noStroke();
      for (let p of confettiParticles) {
        push();
        translate(p.x, p.y);
        rotate(p.rotation);
        fill(p.color);
        rectMode(CENTER);
        rect(0, 0, p.size, p.size * 0.5, 2);
        pop();

        p.y += p.speedY;
        p.x += p.speedX;
        p.rotation += p.rotationSpeed;

        if (p.y > height) {
          p.y = random(-50, 0);
          p.x = random(width);
        }
      }
    }

    // 視窗大小改變時自動調整畫布與按鈕響應
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      if (prevButton) {
        prevButton.position(width / 2 - 160, height - 75);
      }
      if (nextButton) {
        nextButton.position(width / 2 + 30, height - 75);
      }
      if (submitButton) {
        submitButton.position(width / 2 - 80, height - 75);
      }
    }
  </script>
